name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate icon
        run: python make_icon.py
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean ppix-photo-thumb.spec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppix-photo-thumb-windows
          path: dist/ppix-photo-thumb.exe
      - name: Release EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: PPix Photo-thumb v1.1.0
          body: |
            Premiere publication publique de PPix Photo-thumb.
            Executable : ppix-photo-thumb.exe
          files: dist/ppix-photo-thumb.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
